# =========================================================
# render.yaml - Blueprint for Defense Platform
# Defines three core services:
# 1. Redis: Message broker for Celery.
# 2. Web (Django/Gunicorn): The main web application.
# 3. Worker (Celery): Handles background scanning tasks.
# =========================================================

services:
  # -----------------
  #  1. خدمة Redis
  # -----------------
  - type: redis
    name: redis-broker
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  # --------------------
  #  2. خدمة الويب (Django)
  # --------------------
  - type: web
    name: defense-platform-web
    env: python
    pythonVersion: 3.12
    plan: free
    
    # أوامر البناء: تُنفذ مرة واحدة عند كل عملية نشر باستخدام السكربت المخصص.
    buildCommand: |
      chmod +x ./build.sh
      ./build.sh

    # الأمر الذي يُشغل الخادم عند بدء التشغيل.
    startCommand: "gunicorn defense_platform.wsgi:application"
    
    # متغيرات البيئة لهذه الخدمة.
    # هام جدًا: الأسرار (Secrets) تم حذفها من هنا. يجب إضافتها من لوحة تحكم Render.
    envVars:
      # --- متغيرات أساسية ---
      - key: PYTHON_VERSION
        value: 3.12
      - key: SECRET_KEY
        generateValue: true # دع Render ينشئ مفتاحًا سريًا وآمنًا تلقائيًا.
      - key: DEBUG
        value: "False"
      
      # --- متغيرات الاتصال بالخدمات ---
      # رابط قاعدة البيانات من Supabase (سيتم إضافته من لوحة التحكم).
      - key: DATABASE_URL
        value: "YOUR_SUPABASE_DATABASE_URL_HERE" 
      # رابط Redis، يتم جلبه تلقائيًا من خدمة Redis أعلاه.
      - key: REDIS_URL
        fromService:
          type: redis
          name: redis-broker
          property: connectionString
          
      # --- مفاتيح API (سيتم إضافتها من لوحة التحكم) ---
      - key: VIRUSTOTAL_API_KEY
        value: "YOUR_VIRUSTOTAL_API_KEY_HERE"
      - key: GEMINI_API_KEY
        value: "YOUR_GEMINI_API_KEY_HERE"
      - key: TELEGRAM_BOT_TOKEN
        value: "YOUR_TELEGRAM_BOT_TOKEN_HERE"

      # --- إعدادات تخزين الملفات على Supabase ---
      # (سيتم إضافتها من لوحة التحكم)
      - key: AWS_ACCESS_KEY_ID
        value: "YOUR_SUPABASE_S3_ACCESS_KEY_ID_HERE"
      - key: AWS_SECRET_ACCESS_KEY
        value: "YOUR_SUPABASE_S3_SECRET_ACCESS_KEY_HERE"
      # (هذه ليست أسرارًا، لذلك يمكن تركها هنا)
      - key: AWS_STORAGE_BUCKET_NAME
        value: "defense_platform_bucket"
      - key: AWS_S3_REGION_NAME
        value: "eu-central-1"
      - key: AWS_S3_ENDPOINT_URL
        value: "https://jjndqgnscikgzpbvnzwo.supabase.co"

      # --- متغيرات لإنشاء المستخدم الخارق (Superuser) ---
      # (سيتم إضافتها من لوحة التحكم)
      - key: ADMIN_USERNAME
        value: "hamid"
      - key: ADMIN_EMAIL
        value: "h55180d@gmail.com"
      - key: ADMIN_PASSWORD
        value: "rax111rax"

  # ---------------------
  #  3. خدمة العامل (Celery)
  # ---------------------
  - type: worker
    name: defense-platform-worker
    env: python
    pythonVersion: 3.12
    plan: free

    # أوامر البناء: فقط تثبيت الحزم.
    buildCommand: "pip install -r requirements.txt"
    
    # الأمر الذي يُشغل عامل Celery.
    startCommand: "celery -A defense_platform worker -l info"
    
    # متغيرات البيئة: استخدم "fromGroup" لنسخها تلقائيًا من خدمة الويب.
    envVars:
      - fromGroup: defense-platform-web